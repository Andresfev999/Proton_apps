<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgRadial" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#152033"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080C16"/>
    </radialGradient>

    <!-- Bar 1 Gradient (Emerald to Mint) -->
    <linearGradient id="bar1Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00B686"/>
      <stop offset="60%" stop-color="#00E5A3"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>

    <!-- Bar 2 Gradient (Mint to Bright Cyan) -->
    <linearGradient id="bar2Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00C9A7"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Left Face of F (Lit Face: Mint to Glowing White/Cyan Apex) -->
    <linearGradient id="leftFaceGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="25%" stop-color="#00C9A7"/>
      <stop offset="65%" stop-color="#22D3EE"/>
      <stop offset="88%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Right Face of F (Shaded Face: Deep Sky to Electric Azure) -->
    <linearGradient id="rightFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Ambient Glow behind F -->
    <filter id="ambientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Flare Radial Glow -->
    <radialGradient id="flareGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="25%" stop-color="#BAE6FD" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgRadial)"/>
  <!-- Squircle Inner Rim -->
  <rect x="1.5" y="1.5" width="509" height="509" rx="111" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.15"/>

  <!-- Subtle Ambient Glow behind Symbol -->
  <g opacity="0.6" filter="url(#ambientGlow)">
    <rect x="118" y="298.5" width="45" height="84" rx="4" fill="#00E5A3"/>
    <rect x="181.5" y="233" width="45.5" height="149.5" rx="4" fill="#22D3EE"/>
    <polygon points="268,126 218.5,202.5 245.5,202.5 245.5,382.5 290.5,382.5 290.5,296 347,296 363,259 290.5,259 290.5,222.5 378,222.5 393,187.5 290.5,187.5" fill="#38BDF8"/>
  </g>

  <!-- Main Symbol Group -->
  <g id="finup-symbol">
    <!-- Bar 1 (Left) -->
    <rect x="118" y="298.5" width="45" height="84" rx="3" fill="url(#bar1Grad)" stroke="#5EEAD4" stroke-width="1.2" stroke-opacity="0.8"/>

    <!-- Bar 2 (Middle) -->
    <rect x="181.5" y="233" width="45.5" height="149.5" rx="3" fill="url(#bar2Grad)" stroke="#7DD3FC" stroke-width="1.2" stroke-opacity="0.8"/>

    <!-- Bar 3 and F: Right Face (Azure/Sky with Chamfered Arms) -->
    <path d="M268 126 L290.5 187.5 H393 L378 222.5 H290.5 V259 H363 L347 296 H290.5 V382.5 H268 Z" 
          fill="url(#rightFaceGrad)" 
          stroke="#7DD3FC" stroke-width="1.2" stroke-opacity="0.8"/>

    <!-- Bar 3 and F: Left Face (Lit Face with Barb and Center Ridge) -->
    <path d="M268 126 L218.5 202.5 H245.5 V382.5 H268 Z" 
          fill="url(#leftFaceGrad)" 
          stroke="#5EEAD4" stroke-width="1.2" stroke-opacity="0.8"/>

    <!-- 3D Center Ridge Highlight Line -->
    <line x1="268" y1="126" x2="268" y2="382.5" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Lens Flare Diagonal Streak (-40 deg from apex) -->
    <polygon points="268,126 210,50 205,53 268,127" fill="#FFFFFF" opacity="0.85"/>
    <polygon points="268,126 185,15 178,20 268,127" fill="#7DD3FC" opacity="0.4"/>
    
    <!-- Apex Circular Glow -->
    <circle cx="268" cy="126" r="26" fill="url(#flareGlow)"/>
    <circle cx="268" cy="126" r="5" fill="#FFFFFF"/>
  </g>
</svg>
