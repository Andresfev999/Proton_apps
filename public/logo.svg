<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 84" width="380" height="84" fill="none" role="img" aria-label="Proton Apps Logo">
  <defs>
    <!-- Gradients -->
    <radialGradient id="fullCoreGrad" cx="36%" cy="34%" r="65%" fx="30%" fy="28%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#c7d2fe" />
      <stop offset="42%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="90%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </radialGradient>

    <radialGradient id="fullHaloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#03060d" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="fullOrbIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="fullOrbCyan" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="55%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="fullOrbEmerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Brand Text Gradients -->
    <linearGradient id="brandAppsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgePillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.25" />
    </linearGradient>

    <filter id="fullGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ATOM EMBLEM (Scaled & Translated to Left) -->
  <g transform="translate(44, 42) scale(0.62) translate(-60, -60)">
    <!-- Orbits -->
    <ellipse cx="60" cy="60" rx="22" ry="53" stroke="url(#fullOrbIndigo)" stroke-width="3" fill="none" filter="url(#fullGlow)" />
    <ellipse cx="60" cy="60" rx="22" ry="53" transform="rotate(60 60 60)" stroke="url(#fullOrbCyan)" stroke-width="3" fill="none" filter="url(#fullGlow)" />
    <ellipse cx="60" cy="60" rx="22" ry="53" transform="rotate(-60 60 60)" stroke="url(#fullOrbEmerald)" stroke-width="3" fill="none" filter="url(#fullGlow)" />

    <!-- Core Nucleus -->
    <g>
      <circle cx="60" cy="60" r="23" fill="url(#fullHaloGrad)" filter="url(#fullGlow)" />
      <circle cx="60" cy="60" r="17.5" fill="url(#fullCoreGrad)" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1" />
      <ellipse cx="53.8" cy="52.8" rx="5.5" ry="3.2" transform="rotate(-30 53.8 52.8)" fill="#ffffff" opacity="0.9" />
      <circle cx="51" cy="51" r="2" fill="#ffffff" opacity="0.96" />
    </g>

    <!-- Badges -->
    <g transform="translate(9, 21)" filter="url(#fullGlow)">
      <rect x="0" y="0" width="30" height="20" rx="10" fill="#070d1d" stroke="#00f2fe" stroke-width="1.6" />
      <rect x="10" y="4" width="10" height="12" rx="2" fill="none" stroke="#00f2fe" stroke-width="1.2" />
      <line x1="13" y1="5.5" x2="17" y2="5.5" stroke="#00f2fe" stroke-width="0.8" stroke-linecap="round" />
      <circle cx="15" cy="14" r="0.8" fill="#00f2fe" />
    </g>

    <g transform="translate(81, 21)" filter="url(#fullGlow)">
      <rect x="0" y="0" width="30" height="20" rx="10" fill="#070d1d" stroke="#00ff87" stroke-width="1.6" />
      <text x="15" y="12.5" fill="#00ff87" font-size="10" font-weight="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" text-anchor="middle" dominant-baseline="central">APK</text>
    </g>

    <g transform="translate(76, 75)" filter="url(#fullGlow)">
      <rect x="0" y="0" width="30" height="20" rx="10" fill="#070d1d" stroke="#818cf8" stroke-width="1.6" />
      <text x="15" y="12.5" fill="#818cf8" font-size="10" font-weight="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" text-anchor="middle" dominant-baseline="central">OTA</text>
    </g>

    <!-- Energy Nodes -->
    <g filter="url(#fullGlow)">
      <circle cx="60" cy="113" r="4.5" fill="#00ff87" />
      <circle cx="60" cy="113" r="2" fill="#ffffff" />
      <circle cx="17" cy="80" r="4" fill="#00f2fe" />
      <circle cx="17" cy="80" r="1.8" fill="#ffffff" />
      <circle cx="96" cy="42" r="4" fill="#818cf8" />
      <circle cx="96" cy="42" r="1.8" fill="#ffffff" />
    </g>
  </g>

  <!-- BRAND TYPOGRAPHY -->
  <g transform="translate(94, 0)">
    <!-- Main Title -->
    <text x="0" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.03em" fill="#FFFFFF">
      PROTON <tspan fill="url(#brandAppsGrad)">APPS</tspan>
    </text>

    <!-- HUB Pill Badge -->
    <g transform="translate(218, 26)">
      <rect x="0" y="0" width="38" height="19" rx="9.5" fill="url(#badgePillGrad)" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="1" />
      <text x="19" y="10" fill="#22d3ee" font-size="9" font-weight="800" font-family="monospace, sans-serif" letter-spacing="0.1em" text-anchor="middle" dominant-baseline="central">HUB</text>
    </g>

    <!-- Subtitle / Architecture description -->
    <text x="1" y="66" font-family="monospace, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600" font-size="8.8" letter-spacing="0.22em" fill="#94a3b8">
      MOBILE ECOSYSTEM <tspan fill="#38bdf8">&amp;</tspan> OTA ENGINE
    </text>
  </g>
</svg>
